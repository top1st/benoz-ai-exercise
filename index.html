  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Benoz.AI take-home — Platform Foundation</title>
  <style>
    :root {
      color-scheme: light;
      --text: #1a1a1a;
      --muted: #555;
      --line: #ddd;
      --bg: #fafafa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.05rem;
      line-height: 1.55;
      color: var(--text);
      background: var(--bg);
    }
    header, nav, main, footer {
      max-width: 42rem;
      margin: 0 auto;
      padding: 0 1.25rem;
    }
    header { padding-top: 2.5rem; }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin: 0 0 0.35rem;
    }
    header p { margin: 0 0 1.5rem; color: var(--muted); }
    nav {
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--line);
    }
    nav a {
      margin-right: 1rem;
      color: var(--text);
    }
    main { padding-bottom: 3rem; }
    section {
      padding-top: 2rem;
      border-top: 1px solid var(--line);
      margin-top: 2rem;
    }
    section:first-of-type { border-top: 0; margin-top: 0; }
    h2 { font-size: 1.25rem; margin: 0 0 0.75rem; }
    .placeholder { color: var(--muted); font-style: italic; }
    footer {
      padding: 1.5rem 1.25rem 2.5rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
